# Prometheus scrapes the API's /metrics; Grafana shows them. Run: ./run.sh monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090
    extra_hosts:
      - host.docker.internal:host-gateway
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/road-damage.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 127.0.0.1:3001:3000
